spring:
  application:
    name: notification-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://notification-service-db:5432/postgres}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  rabbitmq:
    notification:
      exchanges:
        notificationExchange: ${NOTIFICATION_EXCHANGE:notification.exchange}
      queues:
        exceptions-text: ${NOTIFICATION_EXCEPTIONS_TEXT:exceptions.to.admins}
        exceptions-csv: ${NOTIFICATION_EXCEPTIONS_CSV:exceptions.to.admins.csv}
        task: ${NOTIFICATION_TASK:notification.task}
        task-id: ${NOTIFICATION_TASK_ID:notification.task.listener}
        error: ${NOTIFICATION_ERROR:notification.error}
        error-id: ${NOTIFICATION_ERROR_ID:notification.error.listener}
    host: ${RABBITMQ_HOST:notification-service-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:examinai.notifications@gmail.com}
    password: ${MAIL_PASSWORD:wzmv wedc pnxa cpza}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:examinai.notifications@gmail.com}

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml

server:
  port: ${SERVER_PORT:8050}

management:
  tracing:
    sampling:
      probability: 1
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
